name: Development seed PostgreSQL regression
on:
  pull_request:
    paths:
      - 'backend/src/db/**'
      - 'backend/src/services/**'
      - 'backend/src/utils/**'
      - '.github/workflows/seed-integration.yml'
permissions:
  contents: read
jobs:
  seed-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: scratch-only
          POSTGRES_DB: essential_seed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: backend
      - run: bun run test src/db/developmentSeed.integration.test.ts
        working-directory: backend
        env:
          SEED_TEST_DATABASE_URL: postgresql://postgres:scratch-only@127.0.0.1:5432/essential_seed_test
